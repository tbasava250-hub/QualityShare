<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Dashboard — QualityShare{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --admin-sidebar-width: 260px;
            --admin-bg: #0B132B;
            --admin-text: #E2E8F0;
            --admin-text-muted: #94A3B8;
            --admin-card-bg: #1E293B;
        }

        * {
            box-sizing: border-box;
        }

        body.admin {
            display: flex;
            min-height: 100vh;
            background: var(--admin-bg);
            color: var(--admin-text);
        }

        /* Sidebar */
        .admin-sidebar {
            width: var(--admin-sidebar-width);
            background: var(--admin-bg);
            border-right: 1px solid #334155;
            position: fixed;
            height: 100vh;
            padding: 20px 0;
            overflow-y: auto;
        }

        .admin-sidebar-header {
            padding: 0 24px 32px 24px;
            border-bottom: 1px solid #334155;
            margin-bottom: 24px;
        }

        .admin-sidebar-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #3B82F6;
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
        }

        .admin-sidebar-header .logo svg {
            width: 28px;
            height: 28px;
        }

        .admin-nav {
            padding: 0 12px;
        }

        .admin-nav-item {
            display: block;
            padding: 12px 16px;
            margin-bottom: 4px;
            color: var(--admin-text-muted);
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .admin-nav-item:hover {
            background: #334155;
            color: var(--admin-text);
        }

        .admin-nav-item.active {
            background: #1E40AF;
            color: #fff;
        }

        .admin-nav-item svg {
            width: 18px;
            height: 18px;
            margin-right: 10px;
            vertical-align: middle;
        }

        .admin-main {
            flex: 1;
            margin-left: var(--admin-sidebar-width);
            padding: 40px;
            width: 100%;
        }

        .admin-header {
            margin-bottom: 40px;
        }

        .admin-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
            color: #fff;
        }

        .admin-header .subtitle {
            color: var(--admin-text-muted);
            margin-top: 8px;
            font-size: 0.95rem;
        }

        /* Summary Cards */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            margin-bottom: 48px;
        }

        .summary-card {
            background: var(--admin-card-bg);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid #334155;
        }

        .summary-card-primary { border-left: 4px solid #3B82F6; }
        .summary-card-secondary { border-left: 4px solid #8B5CF6; }
        .summary-card-success { border-left: 4px solid #10B981; }
        .summary-card-warning { border-left: 4px solid #F59E0B; }
        .summary-card-info { border-left: 4px solid #06B6D4; }

        .summary-card-icon {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .summary-card-primary .summary-card-icon { background: rgba(59, 130, 246, 0.1); color: #3B82F6; }
        .summary-card-secondary .summary-card-icon { background: rgba(139, 92, 246, 0.1); color: #8B5CF6; }
        .summary-card-success .summary-card-icon { background: rgba(16, 185, 129, 0.1); color: #10B981; }
        .summary-card-warning .summary-card-icon { background: rgba(245, 158, 11, 0.1); color: #F59E0B; }
        .summary-card-info .summary-card-icon { background: rgba(6, 182, 212, 0.1); color: #06B6D4; }

        .summary-card-content h3 {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--admin-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0 0 8px 0;
        }

        .summary-card-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            margin: 0;
        }

        .summary-card-subtitle {
            font-size: 0.85rem;
            color: var(--admin-text-muted);
            margin: 0;
        }

        /* Admin Panels */
        .admin-panel {
            background: var(--admin-card-bg);
            border-radius: 16px;
            border: 1px solid #334155;
            margin-bottom: 24px;
        }

        .panel-header {
            padding: 20px 24px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
            margin: 0;
        }

        .panel-content {
            padding: 24px;
        }

        /* Activity Grid */
        .activity-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .activity-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .activity-label {
            font-size: 0.85rem;
            color: var(--admin-text-muted);
        }

        .activity-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
        }

        /* Actions Grid */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
        }

        .action-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 24px;
            background: #334155;
            border-radius: 12px;
            text-decoration: none;
            color: var(--admin-text);
            transition: all 0.2s;
        }

        .action-card:hover {
            background: #475569;
            transform: translateY(-2px);
        }

        .action-card svg {
            color: #3B82F6;
        }

        .action-label {
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* Users Table */
        .admin-table-container {
            overflow-x: auto;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
        }

        .admin-table th {
            text-align: left;
            padding: 14px 16px;
            background: #334155;
            color: var(--admin-text-muted);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .admin-table td {
            padding: 16px;
            border-bottom: 1px solid #334155;
            color: var(--admin-text);
        }

        .admin-table tr:last-child td {
            border-bottom: none;
        }

        .admin-table tr:hover td {
            background: #334155;
        }

        .admin-table .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #3B82F6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            font-size: 0.9rem;
        }

        .admin-table .user-name {
            font-weight: 600;
            color: #fff;
        }

        .admin-table .user-email {
            color: var(--admin-text-muted);
            font-size: 0.9rem;
        }

        .admin-table .user-files {
            color: #3B82F6;
            font-weight: 600;
        }

        .admin-table .user-storage {
            color: #10B981;
            font-size: 0.9rem;
        }

        .admin-table .user-date {
            color: var(--admin-text-muted);
            font-size: 0.9rem;
        }

        /* Search and Filters */
        .admin-filters {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .admin-search {
            flex: 1;
            min-width: 280px;
        }

        .admin-search input {
            width: 100%;
            padding: 12px 16px;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
        }

        .admin-search input:focus {
            outline: none;
            border-color: #3B82F6;
        }

        .admin-filters select {
            padding: 12px 16px;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            min-width: 160px;
        }

        /* Pagination */
        .admin-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }

        .admin-pagination a {
            padding: 8px 14px;
            background: #334155;
            color: var(--admin-text);
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .admin-pagination a:hover:not(.disabled) {
            background: #475569;
        }

        .admin-pagination a.active {
            background: #3B82F6;
            color: #fff;
        }

        .admin-pagination a.disabled {
            color: var(--admin-text-muted);
            cursor: not-allowed;
        }

        /* File Details */
        .file-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        .file-detail-section {
            background: #334155;
            padding: 20px;
            border-radius: 12px;
        }

        .file-detail-section h4 {
            color: var(--admin-text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            margin: 0 0 12px 0;
        }

        .file-detail-section dl {
            margin: 0;
        }

        .file-detail-section dt {
            color: var(--admin-text-muted);
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .file-detail-section dd {
            margin: 0;
            color: #fff;
            font-size: 0.95rem;
        }

        .file-preview {
            margin-bottom: 20px;
        }

        .file-preview img,
        .file-preview video {
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #475569;
        }

        /* Storage Stats */
        .storage-chart {
            background: #334155;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .storage-chart h4 {
            color: var(--admin-text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            margin: 0 0 20px 0;
        }

        .storage-bar-container {
            display: flex;
            align-items: flex-end;
            height: 200px;
            gap: 8px;
            margin-top: 20px;
        }

        .storage-bar {
            flex: 1;
            background: linear-gradient(to top, #3B82F6, #60A5FA);
            border-radius: 4px 4px 0 0;
            transition: all 0.3s;
        }

        .storage-bar-label {
            text-align: center;
            font-size: 0.75rem;
            color: var(--admin-text-muted);
            margin-top: 8px;
        }

        .storage-bar-value {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .admin-main {
                margin-left: 0;
                padding: 20px;
            }

            .admin-sidebar {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .file-detail-grid {
                grid-template-columns: 1fr;
            }

            .admin-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="admin">
    <aside class="admin-sidebar">
        <div class="admin-sidebar-header">
            <a href="{{ url_for('admin.index') }}" class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                <span>QualityShare</span>
            </a>
        </div>
        <nav class="admin-nav">
            <a href="{{ url_for('admin.index') }}" class="admin-nav-item{% if request.endpoint == 'admin.index' %} active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                Dashboard
            </a>
            <a href="{{ url_for('admin.users') }}" class="admin-nav-item{% if request.endpoint == 'admin.users' %} active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                Users
            </a>
            <a href="{{ url_for('admin.files') }}" class="admin-nav-item{% if request.endpoint == 'admin.files' %} active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Files
            </a>
            <a href="{{ url_for('admin.storage') }}" class="admin-nav-item{% if request.endpoint == 'admin.storage' %} active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7h-3a2 2 0 0 1-2-2V3a1 1 0 0 0-1-1H6a1 1 0 0 0-1 1v2a2 2 0 0 1-2 2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path></svg>
                Storage
            </a>
        </nav>
    </aside>

    <main class="admin-main">
        <header class="admin-header">
            <h1>{% block page_title %}Admin Dashboard{% endblock %}</h1>
            <p class="subtitle">{% block page_subtitle %}System overview and management{% endblock %}</p>
        </header>

        {% block content %}{% endblock %}
    </main>

    <script>
        // Admin dashboard JavaScript
        document.addEventListener('DOMContentLoaded', function() {
            // Delete file handlers
            document.querySelectorAll('.delete-file-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const fileId = this.dataset.fileId;
                    if (confirm('Are you sure you want to delete this file? This action cannot be undone.')) {
                        fetch(`/admin/files/${fileId}/delete`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            }
                        })
                        .then(res => res.json())
                        .then(data => {
                            if (data.status === 'success') {
                                alert('File deleted successfully');
                                location.reload();
                            } else {
                                alert('Failed to delete file: ' + data.error);
                            }
                        })
                        .catch(err => {
                            alert('Error deleting file: ' + err.message);
                        });
                    }
                });
            });
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
